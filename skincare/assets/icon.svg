<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background — deep near-black with subtle aurora -->
  <defs>
    <radialGradient id="bg" cx="78%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#0e2030" stop-opacity="1"/>
      <stop offset="40%" stop-color="#0a0e16" stop-opacity="1"/>
      <stop offset="100%" stop-color="#07080c" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="22%" stop-color="#9af1ff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#00d4ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0089a8" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Rounded-square base (Safari masks this to its own shape anyway) -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- Soft outer halo -->
  <circle cx="512" cy="512" r="380" fill="url(#halo)"/>

  <!-- Outer thin ring (subtle, glass-like) -->
  <circle cx="512" cy="512" r="296" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Middle thin ring -->
  <circle cx="512" cy="512" r="244" fill="none" stroke="#00d4ff" stroke-opacity="0.28" stroke-width="2"/>

  <!-- Soft glow under orb -->
  <circle cx="512" cy="512" r="190" fill="#00d4ff" opacity="0.35" filter="url(#softGlow)"/>

  <!-- Main orb -->
  <circle cx="512" cy="512" r="172" fill="url(#orb)"/>

  <!-- Inner specular highlight (top-left) -->
  <ellipse cx="468" cy="450" rx="58" ry="38" fill="#ffffff" opacity="0.55"/>

  <!-- Tiny rim highlight at bottom -->
  <path d="M 380 590 Q 512 680 644 590" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
